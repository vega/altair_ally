name: tests

on:
  push:
  pull_request:

jobs:
  locked:
    name: Locked development environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.10.4'
          enable-cache: true
      - name: Install locked development dependencies
        run: uv sync --locked
      - name: Test schema validation and rendering
        run: uv run --locked task test
      - name: Build source distribution and wheel
        run: uv build

  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.11'
            altair: '6.0.0'
            pandas: '1.5.3'
            numpy: 'numpy==1.23.5'
          - python: '3.11'
            altair: '6.0.0'
            pandas: '2.3.3'
            numpy: numpy
          - python: '3.11'
            altair: '6.3.0'
            pandas: '2.3.3'
            numpy: numpy
          - python: '3.13'
            altair: '6.3.0'
            pandas: '2.3.3'
            numpy: numpy
          - python: '3.13'
            altair: '6.3.0'
            pandas: '3.0.3'
            numpy: numpy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.10.4'
          enable-cache: true
      - name: Test supported dependency versions
        # Overlay version pins without changing the project's lockfile.
        run: >-
          uv run --locked --python '${{ matrix.python }}'
          --with 'altair==${{ matrix.altair }}'
          --with 'pandas==${{ matrix.pandas }}'
          --with '${{ matrix.numpy }}'
          task test
